# Mirrors `make ci` (scripts/ci.sh). The repo lives on Cursor Origin (no Actions); this runs
# once it is mirrored to GitHub. No job needs cloud credentials.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.23"
  TF_VERSION: "1.9.8"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --frozen
      - run: make lint

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --frozen
      - run: make typecheck

  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --frozen
      - run: make test

  integration-tests:
    runs-on: ubuntu-24.04
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --frozen
      - name: Start Postgres + LocalStack, terraform apply, migrate
        run: make deps-up
      - run: make test-integration
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: make deps-down

  # Static checks for every Terraform env, including envs/aws. Never plans or applies,
  # and has no AWS credentials.
  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "${{ env.TF_VERSION }}", terraform_wrapper: false }
      - name: fmt, validate, tflint, checkov
        run: make tf-check
        env:
          GITHUB_TOKEN: ${{ github.token }} # tflint plugin download rate limit

  kubernetes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Render overlays
        run: for o in deploy/k8s/overlays/*/; do kubectl kustomize "$o" > /dev/null && echo "ok $o"; done

  docker-build:
    runs-on: ubuntu-24.04
    needs: [lint]
    strategy:
      matrix:
        service: [api, scanner, fixer, verifier]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.service }}
          build-args: SERVICE=${{ matrix.service }}
          tags: patchloop-${{ matrix.service }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: patchloop-${{ matrix.service }}:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --frozen
      - run: mkdir -p build
      - name: Bandit, Semgrep, pip-audit, Trivy fs (images are scanned in docker-build)
        run: SKIP_IMAGES=1 scripts/security.sh
