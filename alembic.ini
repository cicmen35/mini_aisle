# Dev-time Alembic CLI config (`uv run alembic revision --autogenerate -m "..."`).
# Containers use `patchloop-migrate`, which doesn't need this file.
# The database URL is read from PATCHLOOP_DATABASE_URL in migrations/env.py.
[alembic]
script_location = %(here)s/packages/core/src/patchloop_core/db/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
