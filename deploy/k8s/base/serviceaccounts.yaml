# One identity per service. On EKS these would carry an IRSA annotation pointing at the
# matching least-privilege IAM role from infra/terraform/modules/service_iam.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scanner
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fixer
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: verifier
automountServiceAccountToken: false
