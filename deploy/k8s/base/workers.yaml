# Queue consumers. No Service and no ingress: they only pull from SQS.
# terminationGracePeriodSeconds > 20s long-poll + in-flight work, so SIGTERM drains cleanly.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scanner
  labels:
    app.kubernetes.io/name: scanner
    patchloop.dev/role: worker
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: scanner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scanner
        app.kubernetes.io/part-of: patchloop
        patchloop.dev/role: worker
    spec:
      serviceAccountName: scanner
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: scanner
          image: patchloop-scanner
          envFrom:
            - configMapRef: { name: patchloop-config }
            - secretRef: { name: patchloop-secrets }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi, ephemeral-storage: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 2Gi }
---
