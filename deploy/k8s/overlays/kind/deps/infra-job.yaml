# terraform apply against the in-cluster LocalStack (same modules as compose and AWS).
# State is ephemeral like LocalStack itself; re-run by deleting and re-applying the Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: infra
  labels:
    app.kubernetes.io/name: infra
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infra
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: terraform
          image: patchloop-infra
          args: ["apply"]
          env:
            - { name: TF_VAR_localstack_endpoint, value: "http://localstack:4566" }
            - { name: AWS_ACCESS_KEY_ID, value: test }
            - { name: AWS_SECRET_ACCESS_KEY, value: test }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: work
          emptyDir: {}
        - name: tmp
          emptyDir: {}
