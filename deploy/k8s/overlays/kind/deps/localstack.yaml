apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  labels:
    app.kubernetes.io/name: localstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: localstack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: localstack
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: localstack
          # 4.14 is the last community image that runs without an auth token.
          image: localstack/localstack:4.14
          env:
            - { name: SERVICES, value: "sqs,s3,iam,sts" }
            - { name: AWS_DEFAULT_REGION, value: eu-central-1 }
          ports:
            - { name: edge, containerPort: 4566 }
          readinessProbe:
            httpGet: { path: /_localstack/health, port: edge }
            periodSeconds: 5
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  labels:
    app.kubernetes.io/name: localstack
spec:
  selector:
    app.kubernetes.io/name: localstack
  ports:
    - { name: edge, port: 4566, targetPort: edge }
