# Backing services accept traffic only from patchloop app pods, the infra Job and KEDA.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-app
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: patchloop }
          podSelector:
            matchLabels: { app.kubernetes.io/part-of: patchloop }
      ports:
        - { protocol: TCP, port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: localstack-from-app-infra-keda
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: localstack }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: patchloop }
          podSelector:
            matchLabels: { app.kubernetes.io/part-of: patchloop }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: infra }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: keda }
      ports:
        - { protocol: TCP, port: 4566 }
