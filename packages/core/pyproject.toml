[project]
name = "patchloop-core"
version = "0.1.0"
description = "Shared contracts for patchloop: settings, message schemas, queue/storage/LLM/scanner interfaces, DB plumbing."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "boto3>=1.35",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
]

[project.scripts]
patchloop-migrate = "patchloop_core.db.migrate:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patchloop_core"]
