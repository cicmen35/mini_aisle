[project]
name = "patchloop"
version = "0.1.0"
description = "Find -> fix -> verify pipeline for security findings (workspace root)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "patchloop-core",
    "patchloop-api",
    "patchloop-scanner",
    "patchloop-fixer",
    "patchloop-verifier",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
patchloop-core = { workspace = true }
patchloop-api = { workspace = true }
patchloop-scanner = { workspace = true }
patchloop-fixer = { workspace = true }
patchloop-verifier = { workspace = true }

[dependency-groups]
dev = [
    "bandit[toml]>=1.8",
    "boto3-stubs[s3,sqs]>=1.35",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src", "services/*/src", "tests"]
extend-exclude = ["demo-targets", "packages/core/src/patchloop_core/db/migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "N", "SIM", "RUF", "PL", "PT", "C4", "TID", "ERA",
]
ignore = [
    "E501",    # the formatter owns line length; long docstrings/strings are fine
    "PLR0913", # many-args is fine for explicit dependency injection
    "PLR2004", # magic values in tests / status codes
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "PLR2004", "S603", "S607", "PT011"]

[tool.ruff.lint.isort]
known-first-party = [
    "patchloop_core", "patchloop_api", "patchloop_scanner", "patchloop_fixer", "patchloop_verifier",
]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]
mypy_path = [
    "packages/core/src",
    "services/api/src",
    "services/scanner/src",
    "services/fixer/src",
    "services/verifier/src",
]
explicit_package_bases = true
files = ["packages/core/src", "services/api/src", "services/scanner/src", "services/fixer/src", "services/verifier/src", "tests"]
exclude = ["migrations/versions/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-rfEsX", "--strict-markers", "--import-mode=importlib", "-m", "not integration and not e2e"]
timeout = 120
markers = [
    "integration: needs Postgres + LocalStack from docker compose (make deps-up)",
    "e2e: needs the full compose stack incl. API and workers (make up)",
    "todo: covers a TODO(simon) stub; xfails with NotImplementedError until implemented",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

# ---------------------------------------------------------------- bandit
[tool.bandit]
exclude_dirs = ["tests", "demo-targets", ".venv"]
