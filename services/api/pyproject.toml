[project]
name = "patchloop-api"
version = "0.1.0"
description = "patchloop HTTP API: submit scan jobs, query jobs and findings."
requires-python = ">=3.12,<3.13"
dependencies = [
    "patchloop-core",
    "fastapi>=0.115",
    "python-multipart>=0.0.18",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
patchloop-api = "patchloop_api.main:main"

[tool.uv.sources]
patchloop-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patchloop_api"]
