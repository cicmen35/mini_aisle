[project]
name = "patchloop-fixer"
version = "0.1.0"
description = "patchloop fixer worker: asks an LLM for a patch for one finding."
requires-python = ">=3.12,<3.13"
dependencies = ["patchloop-core"]

[project.scripts]
patchloop-fixer = "patchloop_fixer.main:main"

[tool.uv.sources]
patchloop-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patchloop_fixer"]
