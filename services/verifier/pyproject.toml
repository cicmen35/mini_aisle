[project]
name = "patchloop-verifier"
version = "0.1.0"
description = "patchloop verifier worker: applies a patch, re-scans and re-runs tests."
requires-python = ">=3.12,<3.13"
# pytest is a runtime dependency: the verifier runs the *target's* test-suite.
dependencies = ["patchloop-core", "pytest>=8.3"]

[project.scripts]
patchloop-verifier = "patchloop_verifier.main:main"

[tool.uv.sources]
patchloop-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patchloop_verifier"]
